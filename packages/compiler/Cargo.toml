[package]
name = "riddle-compiler-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false   # binaryen not available in this env; CI can re-enable

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
# CI clones the main repo to riddle-src/ before building
riddlec      = { path = "../riddle-src/app/riddlec" }
type-checker = { path = "../riddle-src/crates/type-checker" }
frontend     = { path = "../riddle-src/crates/frontend" }
hir          = { path = "../riddle-src/crates/hir" }
scope-graph  = { path = "../riddle-src/crates/scope-graph" }
rowan        = "0.16.1"
