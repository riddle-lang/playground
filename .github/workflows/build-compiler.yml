name: Build WASM Compiler

on:
  workflow_dispatch:
    inputs:
      riddle_ref:
        description: 'riddle main repo branch / tag / SHA'
        default: 'main'
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 1. Clone the public riddle repo
      - name: Clone riddle
        run: |
          git clone --depth=1 \
            --branch ${{ github.event.inputs.riddle_ref || 'main' }} \
            https://github.com/riddle-lang/riddle.git \
            packages/riddle-src

      # 2. Rust toolchain + wasm32 target
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # 3. wasm-pack
      - uses: jetli/wasm-pack-action@v0.4.0

      # 4. Build
      - name: Build WASM
        run: |
          wasm-pack build packages/compiler \
            --target web \
            --out-dir ../web/public/wasm \
            --release

      # 5. Record which riddle commit was used
      - name: Record riddle SHA
        run: |
          SHA=$(git -C packages/riddle-src rev-parse HEAD)
          echo "RIDDLE_SHA=$SHA" >> "$GITHUB_ENV"
          echo "$SHA" > packages/web/public/wasm/riddle-sha.txt

      # 6. Commit artifacts (skip if nothing changed)
      - name: Commit WASM artifacts
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/web/public/wasm/
          git diff --staged --quiet && echo "No changes." && exit 0
          git commit -m "chore: build WASM from riddle@${RIDDLE_SHA:0:7}"
          git push
